services:
  - type: web
    name: ai-study-companion-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: GUTS_API_KEY
        sync: false
      - key: AUTH_SECRET
        generateValue: true
