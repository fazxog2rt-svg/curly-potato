services:
  - type: web
    name: ai-study-companion
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: GUTS_API_KEY
        sync: false
      - key: AUTH_SECRET
        generateValue: true
